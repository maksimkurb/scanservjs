name: docker

on:
  # Build and push images when a release is published
  release:
    types: [published]

  # Manual build of the selected branch or tag
  workflow_dispatch:

env:
  BUILD_TARGET: scanservjs-core
  BUILD_PLATFORMS: linux/amd64,linux/arm64,linux/arm/v7

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # DockerHub is optional: images are always pushed to GHCR, and also to
      # DockerHub when the credentials are configured
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Set up QEMU for multi-platform build
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            name=${{ env.DOCKERHUB_USERNAME }}/scanservjs,enable=${{ env.DOCKERHUB_USERNAME != '' }}
            ghcr.io/${{ github.repository_owner }}/scanservjs
          # `latest` is added automatically for semver tags that are not
          # pre-releases
          tags: |
            type=semver,pattern={{raw}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=branch

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          target: ${{ env.BUILD_TARGET }}
          platforms: ${{ env.BUILD_PLATFORMS }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
